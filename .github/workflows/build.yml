name: Build ZArchiveForge Artifacts

on:
  # Manual only. Pushing to the repo never starts a build — run this yourself
  # from the Actions tab (or `gh workflow run`) when you actually want installers.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Binaries are published as build artifacts (owner-only, expiring) — NOT as a
# public GitHub Release. The official downloads live on zsync.eu/zarchiveforge/.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_STRICT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  build-windows:
    name: Windows x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        shell: pwsh
        run: |
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add x86_64-pc-windows-msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: windows-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — NSIS + MSI
        run: pnpm tauri build --bundles nsis,msi --target x86_64-pc-windows-msvc

      - name: List bundle output
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== All bundle files ==="
          Get-ChildItem -Recurse src-tauri/target -Include *.exe,*.msi -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== Bundle directory tree ==="
          Get-ChildItem -Recurse src-tauri/target -Directory -Filter bundle -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Upload Windows binaries as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi


  build-macos-intel:
    name: macOS Intel x64 (cross-compiled)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV

      - name: Add x86_64-apple-darwin target
        run: rustup target add x86_64-apple-darwin

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: macos-intel

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — DMG (Intel x64, cross-compiled)
        run: pnpm tauri build --bundles dmg --target x86_64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List bundle output
        if: always()
        run: |
          echo "=== All bundle files ==="
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app' \) 2>/dev/null || echo "(nothing found)"
          echo "=== Bundle directory tree ==="
          find src-tauri/target -type d -name bundle 2>/dev/null || echo "(no bundle dirs)"

      - name: Upload macOS Intel binary as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          if-no-files-found: error
          path: src-tauri/target/**/release/bundle/**/*.dmg


  build-macos-silicon:
    name: macOS Apple Silicon
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: macos-silicon

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — DMG (Apple Silicon, native)
        run: pnpm tauri build --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List bundle output
        if: always()
        run: |
          echo "=== All bundle files ==="
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.app' \) 2>/dev/null || echo "(nothing found)"
          echo "=== Bundle directory tree ==="
          find src-tauri/target -type d -name bundle 2>/dev/null || echo "(no bundle dirs)"

      - name: Upload macOS Apple Silicon binary as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-silicon
          if-no-files-found: error
          path: src-tauri/target/**/release/bundle/**/*.dmg


  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            rpm \
            libdbus-1-dev \
            libasound2-dev \
            pkg-config

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepend Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add x86_64-unknown-linux-gnu target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
          key: linux-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build — deb + AppImage + rpm
        run: pnpm tauri build --bundles deb,appimage,rpm --target x86_64-unknown-linux-gnu
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: List bundle output
        if: always()
        run: |
          echo "=== All bundle files ==="
          find src-tauri/target -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) 2>/dev/null || echo "(nothing found)"
          echo "=== Bundle directory tree ==="
          find src-tauri/target -type d -name bundle 2>/dev/null || echo "(no bundle dirs)"

      - name: Upload Linux binaries as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.rpm


  bundle:
    name: Bundle binaries + checksums for the website
    needs: [build-windows, build-macos-intel, build-macos-silicon, build-linux]
    runs-on: ubuntu-22.04
    if: always() && !cancelled()

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release
          echo "=== release/ ==="
          ls -lah
          (sha256sum *.msi *.exe *.dmg *.deb *.rpm *.AppImage 2>/dev/null || true) > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      # One downloadable artifact with everything, ready to drop into the
      # website's zarchiveforge/releases/ folder. Downloadable from the
      # Actions run page (owner-only) — never published as a public release.
      - name: Upload website release bundle
        uses: actions/upload-artifact@v4
        with:
          name: zarchiveforge-website-release
          if-no-files-found: error
          path: release/**

[package]
name = "zarchiveforge"
version = "0.1.0"
description = "Offline desktop toolkit for creating password-protected archives (ZIP/7z/RAR) and recovering encrypted-archive passwords via dictionary, mask, and brute-force attacks."
authors = ["TheHolyOneZ"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/TheHolyOneZ/ZArchiveForge"
homepage = "https://github.com/TheHolyOneZ/ZArchiveForge"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zarchiveforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }
sevenz-rust2 = "0.21.3"
rayon = "1.12.0"
num_cpus = "1.17.0"
thiserror = "2.0.19"
crossbeam-channel = "0.5.16"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }
sevenz-rust2 = "0.21.3"

